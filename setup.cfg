[flake8]
max-line-length = 100
# E402: the test scripts and a few CLI entry points insert the repository root
# on sys.path before importing project modules, so their imports cannot be at
# the top of the file. That is deliberate -- the tests are run as plain scripts
# (`python tests/test_x.py`) without pytest or an installed package.
extend-ignore = E402
exclude = .git,__pycache__,data_regime_a_fixed_topology_v3,data_regime_b_contingencies_v3,data_regime_a_blocked_v3,ckpt_v3,logs_v3,results_v3,results_a,results_tuned
